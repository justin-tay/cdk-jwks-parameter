version: 2
updates:
  # One pull request a month for all npm updates. Security updates are
  # separate and are opened as soon as an advisory is published.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Types track the oldest supported Node.js (engines in package.json).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
